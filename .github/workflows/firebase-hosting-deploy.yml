name: Deploy web (www/) to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'www/**'

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VACHANAMRUT_FE20C }}'
          channelId: live
          projectId: vachanamrut-fe20c
