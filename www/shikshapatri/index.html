<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikshapatri | Vachanamrut</title>
    <link rel="canonical" href="https://vachanamrut.in/?s=shikshapatri">
    <meta http-equiv="refresh" content="0; url=../?s=shikshapatri">
    <script>
        // Shikshapatri is part of the main app now; keep old links (?id=12, #12, #sloka-12) working.
        (function () {
            var params = new URLSearchParams(location.search);
            var id = parseInt(params.get('id') || location.hash.replace('#', '').replace('sloka-', ''), 10);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    regs.forEach(function (r) { if (r.scope.indexOf('/shikshapatri/') !== -1) r.unregister(); });
                });
            }
            location.replace('../?s=shikshapatri' + (id ? '&id=' + id : ''));
        })();
    </script>
</head>
<body style="background: #E6A623;"></body>
</html>
